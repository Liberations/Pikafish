name: Pikafish
on:
  push:
    branches:
      - master
    tags:
      - 'Pikafish-*'
jobs:
  Pikafish-x86-64:
    name: ${{ matrix.config.name }}-x86-64-universal
    runs-on: ${{ matrix.config.os }}
    env:
      ARCH: x86-64-universal
      COMP: clang
      EXE: Pikafish-${{ matrix.config.name }}-x86-64-universal${{ matrix.config.ext }}
    strategy:
      matrix:
        config:
          - name: Linux
            os: ubuntu-24.04
            shell: bash
          - name: Windows
            os: windows-latest
            shell: msys2 {0}
            ext: .exe
    defaults:
      run:
        working-directory: src
        shell: ${{ matrix.config.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup msys and install required packages
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang make git
      - name: Set up LLVM
        if: runner.os == 'Linux'
        run: |
          LLVM_VERSION=23
          curl -s https://apt.llvm.org/llvm.sh | sudo bash -s -- $LLVM_VERSION
          sudo apt install -y libc++-$LLVM_VERSION-dev libc++abi-$LLVM_VERSION-dev libunwind-$LLVM_VERSION-dev
          echo "EXTRACXXFLAGS=-stdlib=libc++" >> $GITHUB_ENV
          echo "EXTRALDFLAGS=-stdlib=libc++" >> $GITHUB_ENV
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> $GITHUB_PATH
      - name: Compile universal build
        run: |
          make -j4 build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../
      # Artifacts automatically get zipped.
      # To avoid double-zipping, we use the unzipped directory
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}

  Pikafish-x86-64-bmi2:
    name: Linux-x86-64-bmi2
    runs-on: ubuntu-24.04
    env:
      ARCH: x86-64-bmi2
      COMP: gcc
      EXE: Pikafish-Linux-x86-64-bmi2
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Compile bmi2 build
        run: |
          make -j4 build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}

  Pikafish-MacOS:
    name: MacOS-universal
    runs-on: macos-latest
    env:
      COMP: clang
      EXE: Pikafish-MacOS-universal
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Compile universal build
        run: |
          make -j3 macos-lipo EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../
      # Artifacts automatically get zipped.
      # To avoid double-zipping, we use the unzipped directory
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}
  Pikafish-Android:
    name: Android-${{ matrix.arch }}-universal
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - arm64
          - x86-64
    env:
      ARCH: ${{ matrix.arch }}-universal
      COMP: ndk
      EXE: Pikafish-Android-${{ matrix.arch }}-universal
      LDFLAGS: "-static -Wno-unused-command-line-argument"
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - name: Install NDK
        run: |
          NDKV="28.2.13676358"
          ANDROID_ROOT=/usr/local/lib/android
          ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER "ndk;$NDKV"
          ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
          ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV
      - name: Compile universal build
        run: |
          export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
          make -j4 build EXE=$EXE
          make strip EXE=$EXE
          cp $EXE ../
      # Artifacts automatically get zipped.
      # To avoid double-zipping, we use the unzipped directory
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: ${{ env.EXE }}
  Pikafish:
    name: Pikafish
    runs-on: ubuntu-slim
    needs: [Pikafish-x86-64, Pikafish-x86-64-bmi2, Pikafish-MacOS, Pikafish-Android]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Pikafish-*
          path: Artifacts
      - name: Put binaries into release root
        run: cp Artifacts/Pikafish-*/* .
      - name: Download wiki
        run: |
          git clone https://github.com/official-pikafish/Pikafish.wiki.git Wiki
          cd Wiki
          rm -rf .git
      # Artifacts automatically get zipped.
      # To avoid double-zipping, we use the unzipped directory
      - uses: actions/upload-artifact@v7
        with:
          name: Pikafish
          path: |
            Pikafish-*
            Wiki
            AUTHORS
            CONTRIBUTING.md
            Copying.txt
            README.md
            Top CPU Contributors.txt
  Pikafish-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [Pikafish]
    # Only Pikafish-* tags create a release; branch pushes stop after the build.
    if: startsWith(github.ref, 'refs/tags/Pikafish-')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Pikafish
          path: release
      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME#Pikafish-}"
          (cd release && 7z a "../Pikafish.${VERSION}.7z" ./*)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#Pikafish-}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "Pikafish.${VERSION}.7z" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              --draft \
              --title "Pikafish ${VERSION}" \
              --generate-notes \
              "Pikafish.${VERSION}.7z"
          fi
